---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.mlop.io
  resources:
  - inferencescalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.mlop.io
  resources:
  - inferencescalers/finalizers
  verbs:
  - update
- apiGroups:
  - autoscaling.mlop.io
  resources:
  - inferencescalers/status
  verbs:
  - get
  - patch
  - update
