apiVersion: v1
kind: Secret
metadata:
  name: promscale-agent-secret
  namespace: default
type: Opaque
stringData:
  GOOGLE_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promscale-agent
  namespace: default
  labels:
    app: promscale-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promscale-agent
  template:
    metadata:
      labels:
        app: promscale-agent
    spec:
      containers:
        - name: agent
          image: promagent:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: promscale-agent-secret
                  key: GOOGLE_API_KEY
          ports:
            - containerPort: 8081
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: promscale-agent
  namespace: default
spec:
  selector:
    app: promscale-agent
  ports:
    - name: http
      port: 8081
      targetPort: 8081